<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ApplyOnce AI</title>
  <style>
    :root {
      --background: #090909;
      --card: #111111;
      --border: #262626;
      --text: #ffffff;
      --text-muted: #a1a1aa;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.1);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.1);
    }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--background);
      color: var(--text);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 12px;
    }
    .header span {
      background: #ffffff;
      color: #000000;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 12px;
    }
    .muted {
      color: var(--text-muted);
      font-size: 12px;
      margin: 4px 0 12px 0;
      line-height: 1.4;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .status-detecting {
      background: #1e1b4b;
      color: #a5b4fc;
    }
    .status-success {
      background: var(--success-bg);
      color: var(--success);
    }
    .status-warning {
      background: var(--warning-bg);
      color: var(--warning);
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: var(--primary-hover);
    }
    .profile-summary {
      font-size: 12px;
      border-top: 1px solid var(--border);
      margin-top: 8px;
      padding-top: 8px;
    }
    .profile-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .profile-label {
      color: var(--text-muted);
    }
    .profile-val {
      font-weight: 500;
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .footer-links {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 11px;
    }
    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-links a:hover {
      color: var(--text);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>✦</span> ApplyOnce AI
  </div>
  <p class="muted">Fill application forms instantly using your local profile details.</p>
  
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <span style="font-size: 13px; font-weight: 600;">Status</span>
      <span id="status-badge" class="status-badge status-detecting">Scanning...</span>
    </div>
    <div id="status" style="font-size: 12px; color: var(--text-muted); line-height: 1.4;">Checking page elements...</div>
    
    <div class="profile-summary" id="profile-preview">
      <div class="profile-item">
        <span class="profile-label">Profile sync:</span>
        <span id="profile-sync-status" class="profile-val" style="color: var(--warning);">Not synced</span>
      </div>
    </div>
  </div>

  <button id="fill" style="margin-bottom: 8px;">Auto-fill form</button>
  <button id="undo" class="button-secondary" style="width: 100%; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text-muted); padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;">Undo auto-fill</button>
  <div id="result" style="margin-top: 8px; text-align: center; font-size: 12px; font-weight: 500;"></div>
  
  <div class="footer-links">
    <a href="#" id="open-dashboard">Go to Dashboard</a>
    <a href="#" id="sync-now">Sync Profile</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
